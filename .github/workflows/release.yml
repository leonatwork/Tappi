name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build.sh

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # ditto rather than zip: it preserves the code signature and resource forks.
          ditto -c -k --keepParent dist/Tappi.app "Tappi-${VERSION}.zip"
          shasum -a 256 "Tappi-${VERSION}.zip" | tee checksum.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          ## Installation

          1. Download and unzip `Tappi-__VERSION__.zip`
          2. Drag `Tappi.app` into `/Applications`
          3. On first launch: **right-click ▸ Open** (not a double-click)

          Step 3 is needed because this build is not notarised. Alternatively:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Tappi.app
          ```

          Tappi then asks for **Accessibility** (required) and **Screen Recording**
          (optional, only for the window previews).

          > **Note:** this build is ad-hoc signed. macOS ties granted permissions to the
          > signature, so they have to be granted again after an update. To avoid that,
          > build it yourself — `./setup-signing.sh` creates a stable local identity, after
          > which permissions survive every update. See the README.

          Full changes: [CHANGELOG.md](https://github.com/leonatwork/Tappi/blob/master/CHANGELOG.md)
          EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          printf '%s\n\n**SHA-256**\n```\n%s\n```\n' "$NOTES" "$(cat checksum.txt)" > notes.md
          gh release create "$VERSION" "Tappi-${VERSION}.zip" \
            --title "Tappi $VERSION" --notes-file notes.md
