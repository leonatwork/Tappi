name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds and signs without publishing, the zip is kept as an artifact.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Test
        run: swift test -c release

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          # Without the secrets the build falls back to ad-hoc signing, as before.
          if [ -z "$P12" ]; then
            echo "::warning::MACOS_SIGNING_P12 is not set, building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/codesign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=leonatwork Code Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Tag builds use the tag; manual builds fall back to the newest tag in build.sh.
          VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./build.sh

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          codesign --verify --strict "dist/Tappi.app"
          # A stable identity shows up as "certificate leaf" in the designated requirement.
          codesign -d -r- "dist/Tappi.app" 2>&1 | grep "certificate leaf"

      - name: Package
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'manual' }}
        run: |
          # ditto rather than zip: it preserves the code signature and resource forks.
          ditto -c -k --keepParent dist/Tappi.app "Tappi-${VERSION}.zip"
          shasum -a 256 "Tappi-${VERSION}.zip" | tee checksum.txt

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tappi-${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'manual' }}
          path: |
            Tappi-*.zip
            checksum.txt
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tappi-${{ github.ref_name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job has no checkout from which gh could infer the repository.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGNING_NOTE="> **Note:** this build is signed with a stable certificate. Permissions granted once
          > survive later updates that are signed the same way."
          else
            SIGNING_NOTE="> **Note:** this build is ad-hoc signed. macOS ties granted permissions to the
          > signature, so they have to be granted again after an update."
          fi
          NOTES=$(cat <<'EOF'
          ## Installation

          1. Download and unzip `Tappi-__VERSION__.zip`
          2. Drag `Tappi.app` into `/Applications`
          3. On first launch, double-click `Tappi.app` once and dismiss the blocked-launch alert.
             Open **System Settings ▸ Privacy & Security**, scroll down to the Security section,
             and click **Open Anyway** for Tappi. Authenticate with your password or Touch ID if
             prompted, and confirm with **Open** to launch the app.

          Step 3 allows Gatekeeper to open this app because this build is not notarised.
          On macOS 15 and later, right-click ▸ Open no longer bypasses Gatekeeper. Alternatively:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Tappi.app
          ```

          Tappi then asks for **Accessibility** (required) and **Screen Recording**
          (optional, only for the window previews).

          __SIGNING_NOTE__

          Full changes: [CHANGELOG.md](https://github.com/leonatwork/Tappi/blob/master/CHANGELOG.md)
          EOF
          )
          NOTES="${NOTES//__VERSION__/$VERSION}"
          NOTES="${NOTES//__SIGNING_NOTE__/$SIGNING_NOTE}"
          printf '%s\n\n**SHA-256**\n```\n%s\n```\n' "$NOTES" "$(cat checksum.txt)" > notes.md
          gh release create "$VERSION" "Tappi-${VERSION}.zip" \
            --title "Tappi $VERSION" --notes-file notes.md
