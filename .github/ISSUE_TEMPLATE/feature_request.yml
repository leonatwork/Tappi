name: Feature request
description: A suggestion for Tappi
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Please describe the situation, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?

  - type: input
    id: windows
    attributes:
      label: Does Windows do this?
      description: >
        Tappi reproduces the Alt-Tab behaviour of Windows. Pointing at how Windows solves
        something is the strongest argument a suggestion can have.
