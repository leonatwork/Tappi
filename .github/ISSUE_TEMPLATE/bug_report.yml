name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The questions below look fussy but usually save a whole
        round of back-and-forth — especially the diagnostics log.

  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics log
      description: >
        Menu bar icon ▸ "Open diagnostics log", or
        `~/Library/Application Support/Tappi/diagnostics.log`.
        It contains no window titles or other content — only startup state and permissions.
      render: text
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.3"
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Processor
      options: [Apple Silicon, Intel]
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Where did your Tappi come from?
      description: >
        Relevant because ad-hoc signed release builds lose granted permissions after every
        update, while self-built ones with their own signing identity do not.
      options:
        - Release download
        - Built myself (with setup-signing.sh)
        - Built myself (without setup-signing.sh)
    validations:
      required: true

  - type: input
    id: keyboard
    attributes:
      label: Keyboard layout
      description: Important for shortcut problems — ISO and ANSI assign different keycodes.
      placeholder: "e.g. German (ISO)"
